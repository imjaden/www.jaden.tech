<!--
版本说明：v1.3.2@2026/09/09
1. 加载预生成的每日诗词数据（today-poetry-{yymm}.js 按月聚合，简体），缺失时回退 today-poetry.json.js
2. 展示今日信息（公历/农历/节气/事件）+ 推荐诗词（单首轮播展示）
3. 卡片顺序：诗词赏鉴 → 今日信息（含四季节气网格，移除独立标题）
4. 诗词卡片：移除标题序号；标题/作者/正文/理由水平居中
5. 协议适配器支持 file:// 与 http:// 直开
6. favicon 复用 static/img/favicon.svg
7. 移除页面顶部冗余 header，所有信息单页展示，适配移动端
8. 右上角添加 GitHub 角标（指向 script-miner/daily-poetry 源码）
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/favicon.svg?t=1788947889">
    <title>今日诗词</title>
    <script>
        // 按当月加载 today-poetry-{yymm}.js（window.dailyPoetryArchive）
        // onload 时把当日数据同步到 window.dailyPoetryData（统一接口）
        // 月文件不存在则回退 today-poetry.json.js（旧单日文件）
        (function () {
            function getTodayISO() {
                var d = new Date();
                return d.getFullYear() + '-' +
                    ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
                    ('0' + d.getDate()).slice(-2);
            }
            function applyArchive() {
                if (typeof window.dailyPoetryArchive === 'object' && window.dailyPoetryArchive) {
                    var iso = getTodayISO();
                    if (window.dailyPoetryArchive[iso]) {
                        window.dailyPoetryData = window.dailyPoetryArchive[iso];
                    }
                }
            }
            function tryInit() {
                if (window._poetryDomReady && window._poetryDataReady && !window._poetryInited) {
                    window._poetryInited = true;
                    init();
                }
            }
            function loadScript(src, onError) {
                var s = document.createElement('script');
                s.src = src;
                s.onload = function () {
                    applyArchive();
                    window._poetryDataReady = true;
                    tryInit();
                };
                s.onerror = function () {
                    s.remove();
                    if (onError) onError();
                };
                document.head.appendChild(s);
            }
            var now = new Date();
            var yymm = now.getFullYear() + ('0' + (now.getMonth() + 1)).slice(-2);
            loadScript('static/js/today-poetry-' + yymm + '.js', function () {
                loadScript('static/js/today-poetry.json.js', function () {
                    // 两个文件都失败，标记就绪让 init 显示错误提示
                    window._poetryDataReady = true;
                    tryInit();
                });
            });
            document.addEventListener('DOMContentLoaded', function () {
                window._poetryDomReady = true;
                tryInit();
            });
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;

            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: #667eea;
        }

        /* 实时信息 */
        .realtime-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);

            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .info-item .label {

        }

        .info-item .value {

            font-weight: 600;

        }

        /* 诗词卡片（单首轮播） */
        .poem-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .poem-card {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);

            border-left: 4px solid #764ba2;

        /* 诗词轮播导航 */
        .poem-nav-title {
            justify-content: space-between;
        }

        .poem-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
        }

        .poem-nav-btn {

        .poem-nav-count {

            font-weight: 600;
            min-width: 40px;
            text-align: center;
        }

        .poem-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }

        .poem-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
        }

        .poem-author {
            font-size: 1rem;
            color: #7f8c8d;
            text-align: center;
        }

        .poem-meta {
            font-size: 0.8rem;
            color: #95a5a6;
            margin-bottom: 10px;
            text-align: center;
        }

        .poem-meta .tag {
            display: inline-block;
            background: #e8eaf6;
            color: #667eea;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: 6px;
            font-size: 0.75rem;
        }

        .poem-paragraphs {
            font-size: 1.1rem;
            line-height: 2;
            color: #2c3e50;
            text-align: center;
            margin: 15px 0;
            font-family: "STSong", "SimSun", serif;
        }

        .poem-paragraphs p {
            margin: 4px 0;
        }

        .poem-score {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 0.85rem;
            color: #764ba2;
            font-weight: 600;
        }

        .poem-reasons {
            font-size: 0.85rem;
            color: #7f8c8d;

            padding-top: 12px;
            border-top: 1px dashed #dcdde1;
            text-align: center;

        .poem-reasons .reason {
            display: inline-block;

            color: #e67e22;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: 6px;
            margin-bottom: 4px;
            font-size: 0.75rem;
        }

        /* 季节-节气合并卡片 */
        .season-jieqi-grid {
            display: grid;
            margin-top: 10px;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .season-block {
            border-radius: 12px;
            padding: 15px;
            background: #f7f8fa;
            transition: all 0.2s;
        }

        .season-block.active {
            background: linear-gradient(135deg, rgba(67, 233, 123, 0.15) 0%, rgba(56, 249, 215, 0.15) 100%);
            box-shadow: 0 4px 12px rgba(67, 233, 123, 0.25);
        }

        .season-head {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #999;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid transparent;
        }

        .season-block.active .season-head {
            color: #27ae60;
            border-bottom-color: #43e97b;
        }

        .season-head .season-icon {
            font-size: 1.6rem;
            /* display: block; */
            margin-bottom: 4px;
        }

        .jieqi-grid {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 6px;
        }

        .jieqi-chip {
            flex: 1 1 30%;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            background: #eef0f3;
            color: #999;
            text-align: center;
            transition: all 0.2s;
        }

        .jieqi-chip.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
        }

        .jieqi-chip .jieqi-date {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-left: 4px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .season-jieqi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .poem-paragraphs {
                font-size: 1rem;
            }
            .poem-card {
                padding: 18px;
                min-height: 280px;
            }
            .poem-title {
                font-size: 1.15rem;
            }
            .poem-nav-btn {
                width: 28px;
                height: 28px;
            }
        }
        /* GitHub 角标（右上角 fixed） */
        .github-corner {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 100;
            display: block;
        }
        .github-corner svg {
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
        }
        .github-corner:hover .octo-arm {
            animation: octocat-wave 560ms ease-in-out;
        }
        @keyframes octocat-wave {
            0%, 100% { transform: rotate(0); }
            20%, 60% { transform: rotate(-25deg); }
            40%, 80% { transform: rotate(10deg); }
        }
        @media (max-width: 500px) {
            .github-corner:hover .octo-arm {
                animation: none;
            }
            .github-corner .octo-arm {
                animation: octocat-wave 560ms ease-in-out;
            }
        }
    </style>
</head>

    <div class="container">
        <!-- 诗词推荐（单首轮播） -->
        <div class="card">
            <div class="card-title poem-nav-title">
                <span>🎯 诗词赏鉴</span>
                <div class="poem-nav" id="poemNav" style="display:none;">
                    <button class="poem-nav-btn" onclick="prevPoem()" aria-label="上一首">◀</button>
                    <span class="poem-nav-count" id="poemNavCount">1/1</span>
                    <button class="poem-nav-btn" onclick="nextPoem()" aria-label="下一首">▶</button>
                </div>
            </div>
            <div class="poem-list" id="poemList"></div>
        </div>

        <!-- 实时信息（含四季节气网格） -->
        <div class="card">
            <div class="card-title">
                📅 今日信息
            </div>
            <div class="realtime-info" id="realtimeInfo"></div>
            <div class="season-jieqi-grid" id="seasonJieqiGrid"></div>
        </div>

    <script>
        // 24 节气数据（月/日）
        const jieqiData = [
            { name: '立春', month: 2, day: 4 },
            { name: '雨水', month: 2, day: 19 },
            { name: '惊蛰', month: 3, day: 6 },
            { name: '春分', month: 3, day: 21 },
            { name: '清明', month: 4, day: 5 },
            { name: '谷雨', month: 4, day: 20 },
            { name: '立夏', month: 5, day: 6 },
            { name: '小满', month: 5, day: 21 },
            { name: '芒种', month: 6, day: 6 },
            { name: '夏至', month: 6, day: 21 },
            { name: '小暑', month: 7, day: 7 },
            { name: '大暑', month: 7, day: 23 },
            { name: '立秋', month: 8, day: 8 },
            { name: '处暑', month: 8, day: 23 },
            { name: '白露', month: 9, day: 8 },
            { name: '秋分', month: 9, day: 23 },
            { name: '寒露', month: 10, day: 8 },
            { name: '霜降', month: 10, day: 23 },
            { name: '立冬', month: 11, day: 7 },
            { name: '小雪', month: 11, day: 22 },
            { name: '大雪', month: 12, day: 7 },
            { name: '冬至', month: 12, day: 22 },
            { name: '小寒', month: 1, day: 6 },
            { name: '大寒', month: 1, day: 20 }
        ];

        const DYNASTY_MAP = { tang: '唐', song: '宋', pre_qin: '先秦' };
        const GENRE_MAP = { poetry: '诗', ci: '词', shijing: '经' };

        function getWeekday(date) {
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            return weekdays[date.getDay()];
        }

        function getCurrentJieqi(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const currentTime = new Date(year, month - 1, day).getTime();

            let lastJieqi = null;
            let minDiff = Infinity;

            const jieqiList = [];
            jieqiData.forEach((jq, index) => {
                let jqYear = year;
                if (jq.month > month) jqYear = year - 1;
                if (jq.month === month && jq.day > day) jqYear = year - 1;
                jieqiList.push({
                    name: jq.name,
                    time: new Date(jqYear, jq.month - 1, jq.day).getTime(),
                    index: index
                });
            });
            jieqiList.sort((a, b) => a.time - b.time);

            for (let i = 0; i < jieqiList.length; i++) {
                const diff = currentTime - jieqiList[i].time;
                if (diff >= 0 && diff < minDiff) {
                    minDiff = diff;
                    lastJieqi = jieqiList[i].name;
                }
            }
            return lastJieqi || '立春';
        }

        function generateRealtimeInfo(data) {
            const container = document.getElementById('realtimeInfo');
            container.innerHTML = '';

            const lunar = data.lunar;
            const solarTerm = data.solar_term;
            const dateIso = data.date_iso;
            const [y, m, d] = dateIso.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d);
            const weekday = getWeekday(dateObj);

            const infoItems = [
                { label: '公历日期', value: `${y}年${m}月${d}日 ${weekday}` },
                { label: '农历', value: `${lunar.ganzhi_year}年（${lunar.animal}）${lunar.month}月${lunar.day_cn}` },
                { label: '节气', value: solarTerm ? `${solarTerm.term} · ${solarTerm.pentad_name}` : '无' }
            ];

            if (data.lunar_festival) {
                infoItems.push({ label: '农历节日', value: data.lunar_festival });
            }
            if (data.solar_festival) {
                infoItems.push({ label: '公历节日', value: data.solar_festival });
            }
            if (data.historical_events && data.historical_events.length) {
                infoItems.push({ label: '历史事件', value: data.historical_events.join('、') });
            }

            infoItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'info-item';
                div.innerHTML = `
                    <div class="label">${item.label}</div>
                    <div class="value">${item.value}</div>
                `;
                container.appendChild(div);
            });

            // 更新页面标题
            document.title = `今日诗词 · ${dateIso}`;
        }

        let currentPoemIndex = 0;

        function renderCurrentPoem(data) {
            const container = document.getElementById('poemList');
            container.innerHTML = '';

            const recs = data.recommendations || [];
            const nav = document.getElementById('poemNav');
            const navCount = document.getElementById('poemNavCount');

            if (!recs.length) {
                nav.style.display = 'none';
                container.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">暂无推荐诗词</p>';
                return;
            }

            // 边界保护
            if (currentPoemIndex >= recs.length) currentPoemIndex = 0;
            if (currentPoemIndex < 0) currentPoemIndex = recs.length - 1;

            // 仅多于一首时显示轮播
            nav.style.display = recs.length > 1 ? 'flex' : 'none';
            navCount.textContent = `${currentPoemIndex + 1}/${recs.length}`;

            const item = recs[currentPoemIndex];
            const card = document.createElement('div');
            card.className = 'poem-card';

            const dynasty = DYNASTY_MAP[item.dynasty] || item.dynasty;
            const genre = GENRE_MAP[item.genre] || item.genre;
            const reasons = (item.match_reasons || []).map(r =>
                `<span class="reason">${r}</span>`
            ).join('');

            const paragraphs = item.paragraphs.map(p => `<p>${p}</p>`).join('');

            card.innerHTML = `
                <div class="poem-score">score: ${item.score}</div>
                <div class="poem-header">
                    <div class="poem-title">《${item.title}》</div>
                    <div class="poem-author">—— ${item.author}</div>
                </div>
                <div class="poem-paragraphs">${paragraphs}</div>
                <div class="poem-meta">
                    <span class="tag">${dynasty}${genre}</span>
                    ${(item.tags || []).slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('')}
                </div>
                ${reasons ? `<div class="poem-reasons">${reasons}</div>` : ''}
            `;
            container.appendChild(card);
        }

        function prevPoem() {
            const recs = (dailyPoetryData && dailyPoetryData.recommendations) || [];
            if (recs.length <= 1) return;
            currentPoemIndex = (currentPoemIndex - 1 + recs.length) % recs.length;
            renderCurrentPoem(dailyPoetryData);
        }

        function nextPoem() {
            const recs = (dailyPoetryData && dailyPoetryData.recommendations) || [];
            if (recs.length <= 1) return;
            currentPoemIndex = (currentPoemIndex + 1) % recs.length;
            renderCurrentPoem(dailyPoetryData);
        }

        // 四季分组（每季 6 节气）
        const SEASON_GROUPS = [
            { name: '春季', icon: '🌸', months: [1, 2, 3],
              jieqi: ['立春', '雨水', '惊蛰', '春分', '清明', '谷雨'] },
            { name: '夏季', icon: '☀️', months: [4, 5, 6],
              jieqi: ['立夏', '小满', '芒种', '夏至', '小暑', '大暑'] },
            { name: '秋季', icon: '🍂', months: [7, 8, 9],
              jieqi: ['立秋', '处暑', '白露', '秋分', '寒露', '霜降'] },
            { name: '冬季', icon: '❄️', months: [10, 11, 12],
              jieqi: ['立冬', '小雪', '大雪', '冬至', '小寒', '大寒'] }
        ];

        function generateSeasonJieqiGrid(currentDate) {
            const grid = document.getElementById('seasonJieqiGrid');
            grid.innerHTML = '';
            const currentJieqi = getCurrentJieqi(currentDate);
            const currentMonth = currentDate.getMonth() + 1;
            const jieqiMap = {};
            jieqiData.forEach(jq => { jieqiMap[jq.name] = jq; });

            SEASON_GROUPS.forEach(season => {
                const block = document.createElement('div');
                block.className = 'season-block';
                if (season.months.includes(currentMonth)) {
                    block.classList.add('active');
                }

                const chips = season.jieqi.map(name => {
                    const jq = jieqiMap[name] || { month: '', day: '' };
                    const isActive = name === currentJieqi;
                    return `<div class="jieqi-chip${isActive ? ' active' : ''}">` +
                        `${name}<span class="jieqi-date">${jq.month}/${jq.day}</span></div>`;
                }).join('');

                block.innerHTML = `
                    <div class="season-head">
                        <span class="season-icon">${season.icon}</span>
                        ${season.name}
                    </div>
                    <div class="jieqi-grid">${chips}</div>
                `;
                grid.appendChild(block);
            });
        }

        function init() {
            if (typeof dailyPoetryData === 'undefined') {
                document.getElementById('poemList').innerHTML =
                    '<p style="color:#999;text-align:center;padding:20px;">⚠️ 未找到诗词数据（today-poetry-{yymm}.js / today-poetry.json.js），请先执行 daily-poetry month <yyyy-mm> 或 export</p>';
                return;
            }
            const data = dailyPoetryData;
            const [y, m, d] = data.date_iso.split('-').map(Number);
            const currentDate = new Date(y, m - 1, d);

            generateRealtimeInfo(data);
            renderCurrentPoem(data);
            generateSeasonJieqiGrid(currentDate);
        }
    </script>
</body>
</html>
