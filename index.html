<script>
(function () {
  function getTodayISO() {
    var d = new Date();
    return d.getFullYear() + '-' +
      ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
      ('0' + d.getDate()).slice(-2);
  }
  function getCacheBust() {
    var m = window.location.search.match(/[?&]t=(\d+)/);
    return m ? '?t=' + m[1] : '';
  }
  // 诗词区已改为「标题 + 药丸卡」结构与 Now 区一致，诗词标题落在 .now-name 上
  // en 缺省时沿用 zh（诗词标题属专有名词，两语言同一份，见决策 D6）
  function poetryLang() {
    var l = (document.documentElement.lang || '').toLowerCase();
    return l.indexOf('en') === 0 ? 'en' : 'zh';
  }
  function setPoetryName(zh, en) {
    var nameEl = document.querySelector('#poetryName .now-name');
    if (!nameEl) return;
    var enText = (typeof en === 'string' && en) ? en : zh;
    nameEl.setAttribute('data-zh', zh);
    nameEl.setAttribute('data-en', enText);
    // textContent 必须按当前语言落一次：applyLanguage() 早于本脚本执行，不会回填
    nameEl.textContent = poetryLang() === 'en' ? enText : zh;
  }
  function renderPoetry() {
    var iso = getTodayISO();
    var data = null;
    if (typeof window.dailyPoetryArchive === 'object' && window.dailyPoetryArchive) {
      data = window.dailyPoetryArchive[iso];
    }
    if (data && data.recommendations && data.recommendations[0]) {
      // 取 score 最高的第一首（CLI 已按 score 降序）；标题保持中文，两语言同一份
      setPoetryName('《' + data.recommendations[0].title + '》');
    } else {
      // 缺失时不隐藏入口：药丸仍可点，进入 daily-poetry.html 归档页
      setPoetryName('暂无诗词数据', 'No poem data');
    }
  }
  function loadScript(src, onError) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = renderPoetry;
    s.onerror = function () {
      s.remove();
      if (onError) onError();
    };
    document.head.appendChild(s);
  }
  var now = new Date();
  var yymm = now.getFullYear() + ('0' + (now.getMonth() + 1)).slice(-2);
  var cb = getCacheBust();
  loadScript('static/js/today-poetry-' + yymm + '.js' + cb, function () {
    setPoetryName('暂无诗词数据', 'No poem data');
  });
})();
</script>
