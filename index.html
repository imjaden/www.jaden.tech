<script>
(function () {
  function getTodayISO() {
    var d = new Date();
    return d.getFullYear() + '-' +
      ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
      ('0' + d.getDate()).slice(-2);
  }
  function getCacheBust() {
    var m = window.location.search.match(/[?&]t=(\d+)/);
    return m ? '?t=' + m[1] : '';
  }
  function renderPoetry() {
    var iso = getTodayISO();
    var data = null;
    if (typeof window.dailyPoetryArchive === 'object' && window.dailyPoetryArchive) {
      data = window.dailyPoetryArchive[iso];
    }
    var nameEl = document.getElementById('poetryName');
    if (!nameEl) return;
    if (data && data.recommendations && data.recommendations[0]) {
      // 取 score 最高的第一首（CLI 已按 score 降序）
      var poem = data.recommendations[0];
      var title = '《' + poem.title + '》';
      // 诗词标题保持中文，data-zh 与 data-en 均写中文标题
      nameEl.textContent = title;
      nameEl.setAttribute('data-zh', title);
      nameEl.setAttribute('data-en', title);
      nameEl.removeAttribute('aria-disabled');
    } else {
      // 缺失时移除跳转能力，仅展示占位文案
      nameEl.textContent = '暂无诗词数据';
      nameEl.setAttribute('data-zh', '暂无诗词数据');
      nameEl.setAttribute('data-en', '暂无诗词数据');
      nameEl.setAttribute('aria-disabled', 'true');
    }
  }
  function loadScript(src, onError) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = renderPoetry;
    s.onerror = function () {
      s.remove();
      if (onError) onError();
    };
    document.head.appendChild(s);
  }
  var now = new Date();
  var yymm = now.getFullYear() + ('0' + (now.getMonth() + 1)).slice(-2);
  var cb = getCacheBust();
  loadScript('static/js/today-poetry-' + yymm + '.js' + cb, function () {
    var nameEl = document.getElementById('poetryName');
    if (nameEl) nameEl.textContent = '暂无诗词数据';
  });
})();
</script>
