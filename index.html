<script>
(function () {
  function getTodayISO() {
    var d = new Date();
    return d.getFullYear() + '-' +
      ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
      ('0' + d.getDate()).slice(-2);
  }
  function getCacheBust() {
    var m = window.location.search.match(/[?&]t=(\d+)/);
    return m ? '?t=' + m[1] : '';
  }
  // 诗词标题属专有名词，两语言同一份（决策 D6）
  function poetryLang() {
    var l = (document.documentElement.lang || '').toLowerCase();
    return l.indexOf('en') === 0 ? 'en' : 'zh';
  }
  function setName(zh, en) {
    var nameEl = document.getElementById('poetryName');
    if (!nameEl) return;
    var enText = (typeof en === 'string' && en) ? en : zh;
    nameEl.setAttribute('data-zh', zh);
    nameEl.setAttribute('data-en', enText);
    nameEl.classList.remove('is-loading');
    // textContent 必须按当前语言落一次：applyLanguage() 早于本脚本执行，不会回填
    nameEl.textContent = poetryLang() === 'en' ? enText : zh;
  }
  function renderPoetry() {
    var iso = getTodayISO();
    var titles = window.poetryTitles;
    var title = titles && titles[iso];
    if (title) {
      setName(title);
    } else {
      // 缺失时不隐藏入口：药丸仍可点，进入 daily-poetry.html 归档页
      setName('暂无诗词数据', 'No poem data');
    }
  }
  function loadScript(src, onError) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = renderPoetry;
    s.onerror = function () {
      s.remove();
      if (onError) onError();
    };
    document.head.appendChild(s);
  }
  var now = new Date();
  var yymm = now.getFullYear() + ('0' + (now.getMonth() + 1)).slice(-2);
  var cb = getCacheBust();
  // 只拉当日标题索引（~1 KB）；整月包 118-155 KB 留给 daily-poetry.html
  loadScript('static/js/poetry-titles-' + yymm + '.js' + cb, function () {
    setName('暂无诗词数据', 'No poem data');
  });
})();
</script>
