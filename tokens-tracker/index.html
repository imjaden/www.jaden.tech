<script>
/* CL088 C4c: Dashboard 四域指标渲染（壳内**只**渲染, 数据来自 data/dashboard.js）
   口径: 四域指标由生成器按 C1 新口径产出（独占会话归因 / 共享池单列 / 上限 / model 分布）;
        壳不写任何数值 ⇒ 与数据无关, byte 稳定。
   安全: 一律 createElement + textContent（禁 innerHTML 赋值）。
   刷新: 时间范围（M15, 默认近 7 天, localStorage + ?range=）; 刷新按钮走 cache-bust ?t=。
   降级: 数据未达/不可用 ⇒ 显式占位（不静默显示 0）。 */
(function () {
  "use strict";
  var KEY = "wc-dashboard:range";
  var DEFAULT_RANGE = "7";

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined && text !== null) {
      e.appendChild(document.createTextNode(String(text)));
    }
    return e;
  }

  function readRange() {
    try {
      var qs = new URLSearchParams(location.search);
      return qs.get("range") || localStorage.getItem(KEY) || DEFAULT_RANGE;
    } catch (e) { return DEFAULT_RANGE; }
  }

  function applyActive(range) {
    var btns = document.querySelectorAll(".dash-range .range-btn[data-range]");
    Array.prototype.forEach.call(btns, function (b) {
      b.classList.toggle("active", b.getAttribute("data-range") === range);
    });
  }

  function renderStat(s) {
    var box = el("div", "dash-stat");
    box.appendChild(el("span", "dash-stat-label", s.label));
    box.appendChild(el("span", "dash-stat-value", s.value));
    if (s.note) { box.appendChild(el("span", "dash-stat-note", s.note)); }
    return box;
  }

  function renderAnalysis(a) {
    var box = el("div", "dash-anal");
    box.appendChild(el("h3", "dash-anal-title", a.title));
    if (a.note) { box.appendChild(el("p", "dash-anal-note", a.note)); }
    var rows = a.rows || [];
    if (!rows.length) {
      box.appendChild(el("p", "dash-anal-empty", "（无数据）"));
      return box;
    }
    var ul = el("ul", "dash-anal-list");
    rows.forEach(function (r) {
      var li = el("li", "dash-anal-row");
      li.appendChild(el("span", "dash-anal-label", r.label));
      li.appendChild(el("span", "dash-anal-value", r.value));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    return box;
  }

  /* CL231: 使用率四卡（异常优先）+ 修复指令一键复制（点按钮 → clipboard → toast） */
  function showToast(msg) {
    var t = document.getElementById("dash-toast");
    if (!t) {
      t = el("div", "dash-toast");
      t.id = "dash-toast";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; },
        function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  /* CL373: 顶部一句话结论 —— 先回答「今天要不要人动手」，再往下读 */
  function renderVerdict(cards) {
    var n = { critical: 0, warn: 0, unknown: 0, ok: 0 };
    cards.forEach(function (c) { n[c.level] = (n[c.level] || 0) + 1; });
    var level = n.critical ? "critical" : (n.warn ? "warn" : "ok");
    var box = el("div", "dash-verdict lv-" + level);
    var say;
    if (n.critical) {
      say = "有 " + n.critical + " 处需要人处理";
    } else if (n.warn) {
      say = "没有要命的问题，" + n.warn + " 处建议看一眼";
    } else {
      say = "全部正常，不需要动手";
    }
    box.appendChild(el("b", "", say));
    box.appendChild(document.createTextNode(
      "（临界 " + n.critical + " · 预警 " + n.warn + " · 正常 " + n.ok +
      (n.unknown ? " · 未知 " + n.unknown : "") + "）"));
    return box;
  }

  function renderCards(cards) {
    var sec = el("section", "dash-cards-sec");
    var grid = el("div", "dash-cards");
    cards.forEach(function (c) {
      var card = el("div", "dash-card lv-" + (c.level || "unknown"));
      card.setAttribute("data-card", c.key);
      if (c.level === "critical" || c.level === "warn") {
        var danger = c.level === "critical";
        var badge = el("span", "dash-card-badge " + (danger ? "is-danger" : "is-warn"),
                       danger ? "DANGER" : "WARN");
        badge.setAttribute("data-level", c.level);
        badge.setAttribute("role", "status");
        card.appendChild(badge);
      }
      card.appendChild(el("span", "dash-card-label", c.label));
      card.appendChild(el("span", "dash-card-value", c.value));
      if (c.note) { card.appendChild(el("span", "dash-card-note", c.note)); }
      if (c.copy_cmd && c.level !== "ok" && c.level !== "unknown") {
        /* CL373: 按钮复制的是 5W2H Prompt（AI 能接手），命令只在 Prompt 的 How 段里出现 */
        var text = c.prompt || c.copy_cmd;
        var btn = el("button", "dash-card-fix", "⧉ " + (c.action_label || "复制排查 Prompt"));
        btn.type = "button";
        btn.title = "复制 5W2H Prompt（Who/What/When/Where/Why/How/How much）后粘贴给任意 AI";
        btn.setAttribute("aria-label", btn.title);
        btn.addEventListener("click", function () {
          copyText(text).then(function (ok) {
            showToast(ok ? ("已复制 Prompt（" + text.length + " 字），可直接粘贴给 AI")
                         : "复制失败：请手动选择 Prompt 文本");
          });
        });
        card.appendChild(btn);
      }
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    return sec;
  }

  function renderDomain(d) {
    var sec = el("section", "dash-domain");
    sec.setAttribute("data-domain", d.key);
    var head = el("h2", "dash-domain-head");
    var link = el("a", "dash-domain-link", d.label);
    link.href = d.href;
    head.appendChild(link);
    head.appendChild(el("span", "dash-window", d.window || ""));
    sec.appendChild(head);
    if (d.unavailable) {
      sec.appendChild(el("div", "dash-unavailable",
        "⚠️ 数据不可用：" + d.unavailable));
      sec.appendChild(el("p", "dash-unavailable-note",
        "未显示 0（口径不可用时显式占位）；生成器刷新后自动重试"));
      return sec;
    }
    if (d.headline) { sec.appendChild(el("p", "dash-headline", d.headline)); }
    var stats = el("div", "dash-stats");
    (d.stats || []).forEach(function (s) { stats.appendChild(renderStat(s)); });
    sec.appendChild(stats);
    /* CL373: 分布/构成属诊断面 ⇒ 默认折叠，主线只读结论与支撑数 */
    if ((d.analysis || []).length) {
      var det = el("details", "dash-appendix");
      det.appendChild(el("summary", "", "附录 · 明细（分布 / 构成：模型、阶段、Profile、成本）"));
      var anal = el("div", "dash-analysis");
      (d.analysis || []).forEach(function (a) { anal.appendChild(renderAnalysis(a)); });
      det.appendChild(anal);
      sec.appendChild(det);
    }
    return sec;
  }

  function paint(range) {
    var root = document.getElementById("dash-sections");
    if (!root) { return; }
    while (root.firstChild) { root.removeChild(root.firstChild); }
    var payload = window.DASHBOARD || null;
    var sec = payload && payload.ranges ? payload.ranges[String(range)] : null;
    if (!sec) {
      root.appendChild(el("p", "dash-no-data",
        "该时间范围无数据（dashboard 载荷缺 range=" + range + "）"));
      return;
    }
    if (payload.cards && payload.cards.length) {
      root.appendChild(renderVerdict(payload.cards));
      root.appendChild(renderCards(payload.cards));
    }
    (sec.domains || []).forEach(function (d) { root.appendChild(renderDomain(d)); });
    if (payload.caliber) {
      root.appendChild(el("p", "dash-caliber", payload.caliber));
    }
  }

  function setRange(range) {
    try { localStorage.setItem(KEY, range); } catch (e) { /* 私隐模式 */ }
    applyActive(range);
    try {
      var url = location.pathname + location.search.replace(
        /([?&])range=[^&]*/g, "$1").replace(/[?&]$/, "");
      history.replaceState(null, "", url + (url.indexOf("?") >= 0 ? "&" : "?")
        + "range=" + range);
    } catch (e) { /* 无 history 权限 */ }
    paint(range);
  }

  function bindRange() {
    var btns = document.querySelectorAll(".dash-range .range-btn[data-range]");
    Array.prototype.forEach.call(btns, function (b) {
      b.addEventListener("click", function () {
        setRange(b.getAttribute("data-range"));
      });
    });
    var rf = document.getElementById("dash-refresh");
    if (rf) {
      rf.addEventListener("click", function () {
        var search = location.search.replace(/[?&](?:cb|t)=\d+/g, "");
        location.replace(location.pathname + search + (search ? "&" : "?")
          + "t=" + Date.now());
      });
    }
  }

  function initOnce() {
    if (window.__PAGE_INITED) { return; }
    var range = readRange();
    applyActive(range);
    bindRange();
    paint(range);
    window.__PAGE_INITED = true;
  }

  /* 数据未达/加载失败 ⇒ 显式占位（gate 契约: 判据 = 渲染哨兵 __PAGE_INITED） */
  function dataPlaceholder() {
    var root = document.getElementById("dash-sections");
    if (!root) { return; }
    while (root.firstChild) { root.removeChild(root.firstChild); }
    root.appendChild(el("div", "dash-unavailable",
      "⚠️ 数据暂不可用（data/dashboard.js 未就绪）：指标占位, 30 分钟后自动重试"));
  }
  window.__DASH_PLACEHOLDER = dataPlaceholder;

  var ts = Date.now();
  var s = document.createElement("script");
  s.src = "data/dashboard.js?t=" + ts;
  s.onerror = function () { window.WEB_DATA_FAILED = true; };
  document.head.appendChild(s);
  setTimeout(function () { if (!window.WEB_DATA_READY) { window.WEB_DATA_FAILED = true; } }, 5000);
  setTimeout(function () { var search = location.search.replace(/[?&](?:cb|t)=\d+/g, ""); location.replace(location.pathname + search + (search ? "&" : "?") + "t=" + Date.now()); }, 30 * 60 * 1000);

  if (window.WEB_DATA_READY) {
    initOnce();
  } else {
    window.addEventListener("web-data-ready", initOnce);
    setTimeout(function () { if (!window.__PAGE_INITED) { dataPlaceholder(); } }, 5000);
  }
})();
</script>
<script>
/* CL364: 数据时效自证（值取数据层 WEB_DATA_META; 壳内无时间戳 ⇒ byte 稳定） */
(function () {
  function fill() {
    var m = window.WEB_DATA_META || {};
    var g = document.getElementById("wc-generated");
    if (g) { g.textContent = m.generated_at || "未知"; }
    var s = document.getElementById("wc-source");
    if (s && m.source) { s.textContent = " · " + m.source; }
    var st = document.getElementById("wc-stale");
    if (!st) { return; }
    var max = (typeof m.max_age_ms === "number" && m.max_age_ms > 0)
      ? m.max_age_ms : 30 * 3600 * 1000;
    var t = Date.parse(String(m.generated_at || "").replace(" ", "T"));
    if (!isNaN(t) && (Date.now() - t) > max) {
      var mins = Math.round(max / 60000);
      st.textContent = " ⚠️ 数据偏旧（超过 "
        + (mins >= 90 ? Math.round(mins / 60) + " 小时" : mins + " 分钟")
        + " 未刷新）";
      st.style.display = "";
    }
  }
  window.addEventListener("web-data-ready", fill);
  if (window.WEB_DATA_READY) { fill(); }
})();
</script>
